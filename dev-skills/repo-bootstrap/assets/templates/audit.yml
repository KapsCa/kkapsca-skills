name: Dependency Audit

# Compara las librerias que usa el proyecto contra una base publica de librerias
# con fallas de seguridad conocidas.
#
# DIFERENCIA con dependabot.yml:
#   dependabot.yml  -> avisa cuando SALE UNA VERSION NUEVA de algo que usas.
#   audit.yml       -> avisa si algo que YA TENES tiene una falla conocida HOY.
# Los dos hacen falta: son preguntas distintas.
#
# LIMITE: cubre Node, Go y Python. Dart/Flutter NO tiene herramienta oficial de
# auditoria para CI, asi que queda afuera. Ver docs/repository-standards.md.
#
# Este workflow se adapta solo: detecta que stacks tiene el repo y solo corre
# los chequeos que corresponden. No hay que editarlo por proyecto.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect project stacks
        id: stacks
        run: |
          set -euo pipefail
          has() { if [ -f "$1" ]; then echo true; else echo false; fi; }
          if [ -f requirements.txt ] || [ -f poetry.lock ] || [ -f Pipfile.lock ]; then
            python=true
          else
            python=false
          fi
          {
            echo "node=$(has package-lock.json)"
            echo "go=$(has go.mod)"
            echo "python=$python"
          } >> "$GITHUB_OUTPUT"

      - name: Audit Node dependencies
        if: steps.stacks.outputs.node == 'true'
        run: npm audit --audit-level=high

      - name: Set up Go
        if: steps.stacks.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Audit Go dependencies
        if: steps.stacks.outputs.go == 'true'
        run: |
          set -euo pipefail
          # La herramienta se instala con @latest a proposito: un escaner de
          # vulnerabilidades congelado deja de conocer las vulnerabilidades
          # nuevas, y quedaria verde sin analizar nada util.
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Audit Python dependencies
        if: steps.stacks.outputs.python == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            pip-audit
          fi
