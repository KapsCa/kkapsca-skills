  # Librerias de Python.
  # Lo agrega el instalador cuando el repo tiene requirements.txt, poetry.lock
  # o Pipfile.lock.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pip:
        patterns:
          - "*"
