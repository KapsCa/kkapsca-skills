  # Librerias de Dart / Flutter.
  # Lo agrega el instalador cuando el repo tiene pubspec.yaml.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pub:
        patterns:
          - "*"
