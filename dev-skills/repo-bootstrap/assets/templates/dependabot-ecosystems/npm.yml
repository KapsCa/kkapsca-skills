  # Librerias de Node / JavaScript / TypeScript.
  # Lo agrega el instalador cuando el repo tiene package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm:
        patterns:
          - "*"
