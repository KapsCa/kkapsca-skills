name: PR Validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-issue-reference:
    name: Check Issue Reference
    # Un PR generado por un bot (release-please o dependabot) no puede vincular un
    # issue aprobado: no lo crea un humano.
    if: ${{ github.actor != 'dependabot[bot]'
         && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
         && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate linked issue in PR body
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const match = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);

            if (!match) {
              core.setFailed("PR body must include Closes #N, Fixes #N, or Resolves #N.");
              return;
            }

            core.info(`Linked issue detected: #${match[1]}`);

  check-issue-approved:
    name: Check Issue Has status:approved
    # Idem: sin issue vinculado no hay label que validar en un PR de bot.
    if: ${{ github.actor != 'dependabot[bot]'
         && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
         && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate approved issue label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const match = body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);

            if (!match) {
              core.setFailed("Cannot validate issue approval because no linked issue was found in the PR body.");
              return;
            }

            const issue_number = Number(match[1]);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);

            if (!labels.includes('status:approved')) {
              core.setFailed(`Linked issue #${issue_number} must have the label status:approved.`);
              return;
            }

            core.info(`Issue #${issue_number} has status:approved.`);

  check-pr-type-label:
    name: Check PR Has type:* Label
    # Un PR de bot lleva 'autorelease: pending' (release-please) o
    # 'dependencies' (dependabot), nunca un type:*.
    if: ${{ github.actor != 'dependabot[bot]'
         && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
         && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR type label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const typeLabels = labels.filter(name => name.startsWith('type:'));

            if (typeLabels.length !== 1) {
              core.setFailed(`PR must have exactly one type:* label. Found: ${typeLabels.length}.`);
              return;
            }

            core.info(`PR type label detected: ${typeLabels[0]}`);

  check-conventional-commits:
    name: Validate Conventional Commits
    # Idem: una rama de release arrastra commits que no escribio un humano, como
    # los merge commits ("Merge pull request #N from ..."), y ninguno matchea
    # Conventional Commits. Medido: el release PR real #51 fallaba en este job
    # mientras los otros tres se salteaban, y nadie lo noto porque este check no
    # era requerido. Los commits de un PR de release ya se validaron en su propio
    # PR, cuando los escribio un humano.
    if: ${{ github.actor != 'dependabot[bot]'
         && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
         && !startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Get PR commits
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 50,
            });

            const conventionalPattern = /^(feat|fix|docs|style|refactor|perf|test|ci|build|chore|revert)(\([^)]+\))?!?: .{1,}/;
            const invalidCommits = [];

            for (const commit of commits) {
              // Un merge commit no lo escribio un humano: lo genera GitHub al
              // mergear una rama, o al actualizar la rama de un PR ("Update
              // branch", que la proteccion con strict obliga a usar cuando main
              // avanzo). Su mensaje nunca es Conventional, y contarlo como fallo
              // deja el PR sin salida: hay que actualizar para poder mergear, y
              // actualizar es justo lo que hace fallar el check.
              if (commit.parents && commit.parents.length > 1) {
                continue;
              }

              const message = commit.commit.message.split('\n')[0];
              if (!conventionalPattern.test(message)) {
                invalidCommits.push(message);
              }
            }

            if (invalidCommits.length > 0) {
              core.setFailed(
                `The following commits do not follow Conventional Commits format:\n` +
                invalidCommits.map(c => `- ${c}`).join('\n') +
                `\n\nRequired format: <type>(<scope>)?: <description>\n` +
                `Types: feat, fix, docs, style, refactor, perf, test, ci, build, chore, revert`
              );
              return;
            }

            core.info(`All ${commits.length} commit(s) follow Conventional Commits format.`);

  check-no-host-leaks:
    name: Check No Host-Specific Leaks
    # Solo se salta un PR cuando lo escribio un bot, y eso se decide por el
    # AUTOR, no por el nombre de la rama: cualquiera puede nombrar su rama
    # 'release-please--x' y saltear el escaneo si se mira el prefijo.
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'release-please[bot]' }}
    runs-on: ubuntu-latest
    steps:
      # El escaner se carga desde la BASE, nunca desde el head del PR: si saliera
      # del head, un PR podria debilitar su propia copia y pasar el check que lo
      # vigila. Con la base, cada PR se evalua con la version ya aprobada del
      # escaner, y un cambio legitimo al escaner entra en el siguiente PR.
      - name: Check out the base branch (the trusted scanner lives there)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # Solo para el arranque: un repo que adopta el workflow y el escaner en el
      # mismo PR todavia no tiene copia en la base. Se baja aparte y se usa una
      # unica vez, avisando; nunca en un PR normal.
      - name: Check out the PR head into .pr-head (bootstrap fallback only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .pr-head

      - name: Scan the PR diff, title, body and commit messages for host-specific paths
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The scanner lives in scripts/host-path-scan.cjs and is loaded from
            // the BASE branch (checked out above), never from the PR head: a PR
            // must not be able to weaken the copy that checks it. Patterns, the
            // documented-placeholder neutralization and the escaped-form
            // normalization are all defined there.
            //
            // Bootstrap exception: a repository that adopts this workflow and
            // the scanner in the same PR has no copy on base yet, so that run
            // falls back to the head copy checked out in .pr-head and says so
            // out loud. Every later run takes the trusted base copy.
            //
            // No allowlist per file: allowing a whole file would let a new real
            // path slip inside it. Removed lines never count: deleting a leak is
            // the fix, not the problem.
            const fs = require('fs');
            const path = require('path');
            const baseScanner = path.join(process.env.GITHUB_WORKSPACE, 'scripts/host-path-scan.cjs');
            const headScanner = path.join(process.env.GITHUB_WORKSPACE, '.pr-head', 'scripts/host-path-scan.cjs');
            const scannerPath = fs.existsSync(baseScanner) ? baseScanner : headScanner;
            if (scannerPath === headScanner) {
              core.warning(
                'No scanner on the base branch yet: this bootstrap run uses the PR head copy. ' +
                  'Merge the scanner before relying on the trust boundary.'
              );
            }
            const { scan } = require(scannerPath);

            // Un archivo sin patch no se puede escanear. Falla cerrado sin
            // excepcion por extension: un zip, un jar o un pdf tambien pueden
            // llevar una ruta de host adentro. Si el archivo es legitimo y no
            // se puede leer, se divide en el PR.

            function addedLines(patch) {
              return patch
                .split("\n")
                .filter((line) => line.startsWith("+") && !line.startsWith("+++"))
                .map((line) => line.slice(1))
                .join("\n");
            }

            // listFiles pagina a 100 por pagina; los PR de este repo son chicos,
            // pero el bucle no depende de eso.
            async function listAllFiles() {
              const all = [];
              let page = 1;
              for (;;) {
                const { data } = await github.rest.pulls.listFiles({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                  page,
                });
                all.push(...data);
                if (data.length < 100) return all;
                page += 1;
              }
            }

            const findings = [];

            const title = context.payload.pull_request.title || "";
            for (const f of scan(title)) {
              findings.push(`PR title: ${f.label} (${f.snippet})`);
            }

            const body = context.payload.pull_request.body || "";
            for (const f of scan(body)) {
              findings.push(`PR body: ${f.label} (${f.snippet})`);
            }

            // listCommits pages at 100 per page; the loop reads every page, the
            // same way listFiles below does. Merge commits are scanned too:
            // GitHub generates their message, but the branch name in it is
            // chosen by a human and can carry a host path.
            async function listAllCommits() {
              const all = [];
              let page = 1;
              for (;;) {
                const { data } = await github.rest.pulls.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                  page,
                });
                all.push(...data);
                if (data.length < 100) return all;
                page += 1;
              }
            }

            for (const commit of await listAllCommits()) {
              for (const f of scan(commit.commit.message)) {
                findings.push(`commit ${commit.sha.slice(0, 7)} (message): ${f.label} (${f.snippet})`);
              }
            }

            // Un archivo sin patch (binario, o diff demasiado grande) no se puede
            // escanear por lineas. Se lee su contenido desde la API y se escanea
            // igual: no se saltea en silencio, y tampoco se rechaza un binario
            // legitimo sin mirarlo. La API no devuelve el contenido arriba de
            // 1 MB: ahi si se falla cerrado, porque no hay forma de mirarlo.
            async function scanUnpatchedFile(file) {
              if (file.status === "removed") return;
              let data;
              try {
                ({ data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.filename,
                  ref: context.payload.pull_request.head.sha,
                }));
              } catch (error) {
                findings.push(`${file.filename}: could not be read (${error.message}).`);
                return;
              }
              if (Array.isArray(data) || !data.content || data.encoding !== "base64") {
                findings.push(
                  `${file.filename}: too large for the API to return (over 1 MB). ` +
                  `Move it to its own PR so the check can read it.`
                );
                return;
              }
              // latin1 conserva un byte por caracter: sirve para buscar texto
              // ASCII dentro de un archivo binario sin romper la decodificacion.
              const decoded = Buffer.from(data.content, "base64").toString("latin1");
              for (const f of scan(decoded)) {
                findings.push(`${file.filename} (content): ${f.label} (${f.snippet})`);
              }
            }

            for (const file of await listAllFiles()) {
              if (!file.patch) {
                await scanUnpatchedFile(file);
                continue;
              }
              for (const f of scan(addedLines(file.patch))) {
                findings.push(`${file.filename} (added line): ${f.label} (${f.snippet})`);
              }
            }

            if (findings.length > 0) {
              core.setFailed(
                "The PR adds host-specific paths. Replace them with generic forms " +
                "(~, $HOME, repo-relative paths) before merging:\n" +
                findings.map((f) => `- ${f}`).join("\n") +
                "\nDocs may describe these paths with a placeholder " +
                "(/home/<usuario>/, /mnt/<disco>/...), never with a real one."
              );
              return;
            }

            core.info("No host-specific paths in the PR diff, title, body or commit messages.");

  check-host-path-scan:
    name: Check Host-Path Scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # The scanner module is the runtime dependency of the required
      # check-no-host-leaks job: until now it lived inline in YAML with no
      # test coverage, and the gate failed on itself twice.
      - name: Run the host-path scanner tests
        run: node --test "tests/**/*.test.cjs"
      # 6caf971 was exactly this drift: the template and the live scanner
      # diverged. Byte-identical is the rule, and cmp fails closed.
      - name: Fail if the scanner drifted from its bootstrap template
        run: |
          if ! cmp -s scripts/host-path-scan.cjs dev-skills/repo-bootstrap/assets/templates/host-path-scan.cjs; then
            echo "::error::scripts/host-path-scan.cjs and dev-skills/repo-bootstrap/assets/templates/host-path-scan.cjs are not byte-identical. Copy one over the other so the live gate and the bootstrap template stay in sync."
            exit 1
          fi
